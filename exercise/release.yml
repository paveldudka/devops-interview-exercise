name: ECS worker release

# This fixture is inactive because it lives outside .github/workflows.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish once
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: example.invalid/interview-worker:${{ github.sha }}
      - name: Record the immutable registry identity
        id: image
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${IMAGE_DIGEST}"
          echo "image_ref=example.invalid/interview-worker@${IMAGE_DIGEST}" >> "${GITHUB_OUTPUT}"

  deploy_staging:
    runs-on: ubuntu-latest
    environment: staging
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Deploy staging
        run: >-
          terraform -chdir=infra apply -auto-approve
          -var-file=staging.tfvars
          -var='image_ref=${{ needs.build.outputs.image_ref }}'

  deploy_production:
    runs-on: ubuntu-latest
    environment: production
    needs: [build, deploy_staging]
    concurrency:
      group: interview-worker-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy production
        run: >-
          terraform -chdir=infra apply -auto-approve
          -var-file=production.tfvars
          -var='image_ref=${{ needs.build.outputs.image_ref }}'
