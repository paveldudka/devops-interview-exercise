name: Unsafe ECS release exercise

# This is an inactive fixture. It intentionally lives outside .github/workflows.
on:
  workflow_dispatch:

jobs:
  deploy_staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Build staging image
        run: docker build -t example.invalid/interview-worker:latest .
      - name: Deploy staging
        continue-on-error: true
        run: terraform -chdir=infra apply -auto-approve -var-file=staging.tfvars -var='image_ref=example.invalid/interview-worker:latest'

  deploy_production:
    runs-on: ubuntu-latest
    environment: production
    needs: deploy_staging
    steps:
      - uses: actions/checkout@v4
      - name: Build production image again
        run: docker build -t example.invalid/interview-worker:latest .
      - name: Deploy production
        run: terraform -chdir=infra apply -auto-approve -var-file=production.tfvars -var='image_ref=example.invalid/interview-worker:latest' || true
